<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>천안아산 보금자리 매니저</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1>천안아산 보금자리 매니저</h1>
            <p>신혼부부를 위한 미래 가치 기반 맞춤형 아파트 추천</p>
        </div>
    </header>

    <main class="container main-content">
        <!-- Asset Input Section -->
        <section class="card glass budget-planner">
            <h2>💰 나의 자산 계획</h2>
            <div class="input-grid">
                <div class="input-group">
                    <label for="cash">현재 가용 자산 (만원)</label>
                    <input type="number" id="cash" placeholder="예: 15000" min="0">
                </div>
                <div class="input-group">
                    <label for="monthly-savings">월 목표 저축액 (만원)</label>
                    <input type="number" id="monthly-savings" placeholder="예: 200" min="0">
                </div>
                <div class="input-group">
                    <label for="loan-limit">희망 대출액 (만원)</label>
                    <input type="number" id="loan-limit" placeholder="예: 30000" min="0">
                </div>
            </div>
            <div class="summary-box" id="budget-summary">
                내 집 마련 가능한 총 예산: <span id="total-budget">0</span> 만원
            </div>
        </section>

        <!-- Smart Filter Section -->
        <section class="card glass smart-filter">
            <h2>🎯 맞춤 필터</h2>
            <div class="filter-group">
                <label>추천 테마 (중복 선택 가능)</label>
                <div class="chip-container" id="edu-chips">
                    <button class="chip active" data-value="all">전체</button>
                    <button class="chip" data-value="elementary">초품아</button>
                    <button class="chip" data-value="academy">학원가 인접</button>
                    <button class="chip" data-value="subway">역세권</button>
                    <button class="chip" data-value="park">공세권(호수)</button>
                    <button class="chip" data-value="brand">1군 브랜드</button>
                </div>
            </div>
        </section>

        <!-- Result Section -->
        <section class="result-section">
            <div class="section-header">
                <h2>🏠 추천 보금자리</h2>
                <span class="sort-info">미래 가치 점수순</span>
            </div>
            <div id="apartment-list" class="apartment-grid">
                <!-- Apartment cards will be injected here by JS -->
                <div class="loader">데이터를 불러오는 중...</div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2026 Cheonan-Asan Sweet Home Manager. 모든 정보는 분석 목적으로만 제공됩니다.</p>
        </div>
    </footer>

    <!-- Chatbot UI -->
    <div id="chatbot-container" class="chatbot-hidden">
        <div class="chatbot-window glass">
            <div class="chatbot-header">
                <h3>🏠 AI 보금자리 매니저</h3>
                <button id="close-chat">&times;</button>
            </div>
            <div id="chat-messages" class="chat-messages">
                <div class="message bot">안녕하세요! 천안/아산 지역 집 마련에 대해 궁금한 점을 물어보세요.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="질문을 입력하세요...">
                <button id="send-chat">전송</button>
            </div>
        </div>
    </div>
    <button id="chatbot-toggle" class="chatbot-btn">
        <span>💬</span>
    </button>

    <script>
      // This is a placeholder for environment variable injection
      // In a real hosting environment (like Firebase Hosting or IDX), 
      // these values are often injected at build or runtime.
      window.ENV_API_KEY = "AIzaSyBYph46fnUM-USuhDAcblYWBpr4C2IZ2Gg"; // Still hardcoded for preview, but logic is ready for .env
    </script>
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
